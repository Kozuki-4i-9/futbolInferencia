
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Simultánea de Cuadros de Texto</title>
    <style>
        input {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 300px;
        }
    </style>
</head>
<body>
    <input type="text" id="input1" placeholder="Cuadro 1">
    <input type="text" id="input2" placeholder="Cuadro 2">
    <input type="text" id="input3" placeholder="Cuadro 3">
    <input type="text" id="input4" placeholder="Cuadro 4">
    <input type="text" id="input5" placeholder="Cuadro 5">
    <input type="text" id="input6" placeholder="Cuadro 6">

    <script>
        // PROGRAMA PARA EDITAR INPUTS
        // Obtener todos los cuadros de texto
        const inputs = document.querySelectorAll('input[type="text"]');

        // Función para actualizar todos los cuadros de texto
        function updateInputs(event) {
            const value = event.target.value; // Obtener el valor del cuadro que se está editando
            inputs.forEach(input => {
                if (input !== event.target) { // No actualizar el cuadro que se está editando
                    input.value = value; // Actualizar el valor
                }
            });
        }

        // Agregar el evento 'input' a cada cuadro de texto
        inputs.forEach(input => {
            input.addEventListener('input', updateInputs);
        });
    </script>
</body>
</html>
